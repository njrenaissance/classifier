# Services for the integration tests (see .github/workflows/integration-tests.yml).
# tests/test_db.py starts its own Postgres with testcontainers; this service is the
# shared, healthchecked database the workflow waits on before running them.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: classifier
      POSTGRES_PASSWORD: classifier
      POSTGRES_DB: classifier
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U classifier -d classifier"]
      interval: 2s
      timeout: 3s
      retries: 15
