name: CI Pipeline

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      # ...but categories.md is baked into the image and parsed at runtime, so a
      # change to it must NOT skip CI (negation exempts it from the ignore above).
      - "!categories.md"
      - ".claude/**"

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:

  lint:
    name: Lint & Format
    uses: ./.github/workflows/format-lint.yml

  type-check:
    name: Type Check
    uses: ./.github/workflows/type-check.yml

  unit-tests:
    name: Unit Tests
    needs: [lint, type-check]
    uses: ./.github/workflows/unit-tests.yml

  docker-build:
    name: Docker Build
    needs: [lint, type-check]
    uses: ./.github/workflows/docker-build.yml
